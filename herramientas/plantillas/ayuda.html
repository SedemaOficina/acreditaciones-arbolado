<!-- Letrero de ayuda (decisión de Liber del 26/10/2026: sin registro asistido): quien no sabe leer ni escribir usa el sistema
     igual que todos y puede pedir ayuda. Aviso neutro del estándar (.aviso, ícono de información), una vez por pantalla y
     después de la acción principal, para no empujarla en teléfono. Fragmento compartido: herramientas/plantillas/ayuda.html;
     lo inserta construir-sitio.mjs con la sede, su dirección y el horario de los parámetros de la base. Sin teléfono hasta
     que P132 lo defina. -->
<div class="aviso" data-ayuda>
  <svg class="icono" aria-hidden="true"><use href="#i-info"></use></svg>
  <div class="aviso-texto"><strong class="aviso-titulo">{{titulo}}</strong>
    <p>Puedes pedirle a un familiar, a un amigo o al personal de la Secretaría que te ayude. También puedes ir al {{sede}}{{direccion}}, {{horario}}, y ahí te ayudamos.</p></div>
</div>
